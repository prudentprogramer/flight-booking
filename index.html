<!DOCTYPE html>
<html lang="en" style="color-scheme: light;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24/7 Flight Booking & Cancellation Support</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Speak with a live travel agent for booking, cancellation, refund, or flight changes — any time, day or night. 📞 Call Now: +1 (650) 399-9705">
    
    <style>
        /* Responsive CSS Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            color: #1a1a1a;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.15rem);
            color: #555555;
            margin-bottom: 30px;
        }

        .cta-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .phone-number {
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            font-weight: bold;
            color: #0284c7;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
        }

        .phone-number:hover {
            text-decoration: underline;
        }

        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
            width: 100%;
            max-width: 300px;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        /* Mobile Optimization Adjustments */
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>24/7 Flight Booking & Cancellation Support</h1>
        <p>Speak with a live travel agent for booking, cancellation, refund, or flight changes — any time, day or night.</p>
        
        <div class="cta-box">
            <p style="margin-bottom: 5px; font-weight: 600; color: #333;">📞 Call Now:</p>
            <a href="tel:+16503999705" class="phone-number">+1 (650) 399-9705</a>
        </div>

        <a href="tel:+16503999705" class="btn">Speak With an Agent</a>
    </div>

</body>
</html>
